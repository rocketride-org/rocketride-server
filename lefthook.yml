colors: false # disabled to fix terminal corruption on Windows
pre-commit:
  parallel: false # sequential to avoid ruff cache write conflicts
  commands:
    gitleaks:
      tags: security
      run: gitleaks protect --verbose --redact --staged --config .gitleaks.toml
    # Mirrors CI `ci-lint` (./builder lint:check). Prettier covers CODE files
    # only — see PRETTIER_GLOBS in tools/checks/scripts/tasks.js for why
    # Markdown/CSS/HTML are not yet formatted.
    eslint:
      glob: '*.{js,ts,jsx,tsx,mjs,cjs,mts,cts}'
      run: npx --no-install eslint --max-warnings 521 {staged_files}
    prettier:
      glob: '*.{js,ts,jsx,tsx,mjs,cjs,mts,cts,json,yaml,yml}'
      run: npx --no-install prettier --check {staged_files}
    ruff-check:
      glob: '*.py'
      run: ruff check {staged_files}
    ruff-format:
      glob: '*.py'
      run: ruff format --check {staged_files}
