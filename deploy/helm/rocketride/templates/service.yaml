apiVersion: v1
kind: Service
metadata:
  name: {{ include "rocketride.fullname" . }}-engine
  labels:
    {{- include "rocketride.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  type: {{ .Values.engine.service.type }}
  {{- with .Values.engine.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- with .Values.engine.service.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.engine.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "rocketride.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: engine
