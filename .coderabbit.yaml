# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: assertive
  auto_review:
    enabled: true
    base_branches:
      - develop
      - release/.*
    drafts: false
    ignore_title_keywords:
      - '[bot]'
      - 'renovate'
      - 'dependabot'
      - 'release'
      - 'chore(release)'
  path_filters:
    - '!dist/**'
    - '!build/**'
    - '!node_modules/**'
    - '!pnpm-lock.yaml'
    - '!vcpkg/**'
  path_instructions:
    - path: '**/*.{ts,tsx,js,jsx,mjs,cjs}'
      instructions: |
        TypeScript/JavaScript: strict mode, ES2022 target, ESNext modules.
        Unused variables must be prefixed with underscore (_).
        Follow eslint flat config in eslint.config.mjs and prettier formatting.
    - path: 'nodes/**/*.py'
      instructions: |
        Python pipeline nodes: use single quotes, ruff for linting/formatting,
        PEP 257 docstrings, target Python 3.10+.
    - path: 'packages/server/**/*.{cpp,h,hpp}'
      instructions: |
        C++ code: C++17 standard. This is the core engine — review for
        memory safety, thread safety, and performance.
    - path: 'nodes/src/nodes/**/README.md'
      instructions: |
        Node READMEs follow docs/development/node-readme-schema.md (structure is
        machine-checked by scripts/validate-node-readme.py; focus review on
        accuracy). Verify the prose matches the node's code and services*.json:
        the "As a tool" table must list exactly the functions the node exposes
        to agents, lane and connection descriptions must match declared
        behavior, and Example pipelines must reference nodes that exist. Never
        accept hand edits inside the ROCKETRIDE:GENERATED:PARAMS region. If a
        PR changes node behavior, config fields, or tools without updating the
        README, flag it. A PR adding a NEW node must ship the example bundle:
        example.pipe + example.png in the node directory, embedded at the top
        of Example pipelines (screenshot + shields.io download badge) per the
        schema; flag new nodes without it.
    - path: 'docs/clients/**/*.md'
      instructions: |
        Client docs follow docs/development/client-readme-schema.md. The Python
        and TypeScript readmes must stay in parity: an API method, type, or
        exception documented in one must be documented in the other or be
        explicitly marked language-specific. Package READMEs are generated
        from these sources via `builder docs:export` — never review edits to
        packages/client-*/README.md as hand-written files.
  tools:
    eslint:
      enabled: true
    ruff:
      enabled: true
    cppcheck:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    team_keys: []
  pull_requests:
    scope: auto
