# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: assertive
  auto_review:
    enabled: true
    base_branches:
      - develop
      - release/.*
    drafts: true
    ignore_title_keywords:
      - '[bot]'
      - 'renovate'
      - 'dependabot'
      - 'release'
      - 'chore(release)'
  path_filters:
    - '!dist/**'
    - '!build/**'
    - '!node_modules/**'
    - '!pnpm-lock.yaml'
    - '!vcpkg/**'
  path_instructions:
    - path: '**/*.{ts,tsx,js,jsx,mjs,cjs}'
      instructions: |
        TypeScript/JavaScript: strict mode, ES2022 target, ESNext modules.
        Unused variables must be prefixed with underscore (_).
        Follow eslint flat config in eslint.config.mjs and prettier formatting.
    - path: 'nodes/**/*.py'
      instructions: |
        Python pipeline nodes: use single quotes, ruff for linting/formatting,
        PEP 257 docstrings, target Python 3.10+.
    - path: 'nodes/src/nodes/**/services*.json'
      instructions: |
        Node contract. Changing inputs, outputs, config or credential-shaped
        fields must regenerate the node README's ROCKETRIDE:GENERATED:PARAMS
        block and the credentials catalog (`./builder surfaces:check`).
        Flag PRs that edit the generated README block by hand, or that change
        a lane/field without a matching README prose update.
    - path: 'packages/{shell,client-typescript}/contract/**'
      instructions: |
        Frozen API contract floors. versions/*.d.ts are immutable once minted;
        index.ts / latest.ts / *.generated.ts are derived by shell:regen-derived
        and client-typescript:regen. Flag any hand edit here — a floor line
        removed or narrowed lets a breaking API change past the tsc gates.
    - path: '{AGENTS.md,CLAUDE.md,.cursorrules}'
      instructions: |
        AGENTS.md is the single source of truth for contributor rules; the
        other files must stay pointers. Flag duplicated or contradicting
        guidance, commands that are not registered builder actions, and any
        claim about timing or behaviour that is not verified.
    - path: 'packages/server/**/*.{cpp,h,hpp}'
      instructions: |
        C++ code: C++17 standard. This is the core engine — review for
        memory safety, thread safety, and performance.
  tools:
    eslint:
      enabled: true
    ruff:
      enabled: true
    cppcheck:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    team_keys: []
  pull_requests:
    scope: auto
