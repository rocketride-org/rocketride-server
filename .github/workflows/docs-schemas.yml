# ---------------------------------------------------------------------------
#  Documentation schema checks — the PR gate for doc contracts.
#
#  Runs the docs builder gates (docs:test, which carries the schema
#  validators, plus docs:build and docs:check) on doc-path pull requests into
#  develop (and direct pushes to it). ci.yml deliberately does not carry
#  them — the paths filter below keeps doc-only machinery from spending the
#  shared pipeline's minutes, and non-doc changes from spending these.
# ---------------------------------------------------------------------------
name: Doc schemas

on:
  pull_request:
    branches: [develop]
    # GitHub Actions YAML has no anchors — keep this list identical to push's.
    paths:
      - 'docs/**'
      - 'nodes/src/nodes/**/README.md'
      - 'nodes/src/nodes/**/services*.json'
      - 'scripts/validate-node-readme.py'
      - 'scripts/validate-client-docs.py'
      - 'tests/test_validate_node_readme.py'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-schemas.yml'
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'nodes/src/nodes/**/README.md'
      - 'nodes/src/nodes/**/services*.json'
      - 'scripts/validate-node-readme.py'
      - 'scripts/validate-client-docs.py'
      - 'tests/test_validate_node_readme.py'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-schemas.yml'

concurrency:
  group: docs-schemas-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  #  Stage and compile the docs site. Catches what only a full build can:
  #  broken internal links, files under docs/ not covered by a mount, and
  #  spine entries with no backing page. docs:test guards the gather/export
  #  logic itself and runs the node README and client-doc validators;
  #  docs:check is the export drift gate. Blocking — every failure mode here
  #  is deterministic. (docs.yml's deploy build re-runs the same commands on
  #  develop with the full-history checkout its sitemap <lastmod> stamping
  #  needs; a shallow clone is fine for a PR gate.)
  # -------------------------------------------------------------------------
  build:
    name: Docs site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install validator test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==8.4.1
      - name: Docs unit tests
        run: node scripts/build.js docs:test
      - name: Build docs site
        run: node scripts/build.js docs:build
      - name: Check docs export drift
        run: node scripts/build.js docs:check
