name: Docker

# Default least-privilege permissions for the workflow. Individual jobs
# below raise to write where they actually need it (image push to GHCR).
# Closes Scorecard TokenPermissionsID #514.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (branch, tag, or sha). Empty uses the default.
        required: false
        type: string
        default: ''
      server_version:
        required: true
        type: string
      prerelease:
        required: false
        type: boolean
        default: false
      tag_suffix:
        description: >-
          Custom tag suffix for builds that must NOT touch the shared tags —
          experimental / workshop / hotfix branches. When set, the image is
          published ONLY as <version>-<suffix> and `latest` is deliberately
          skipped, so a branch build cannot become what everything else
          resolves to. Empty preserves the previous behaviour exactly.
        required: false
        type: string
        default: ''

jobs:
  docker:
    name: ${{ inputs.prerelease && 'Publish Docker prerelease image' || 'Publish Docker image' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing via Sigstore (GitHub OIDC).
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}

      # `github.sha` is the workflow-file's trigger SHA, not necessarily the
      # commit checked out above (e.g. prerelease.yaml passes a workflow_run
      # head_sha as `ref`). Resolve the actual checked-out commit instead, so
      # the label always matches what was built. See #1759.
      - name: Resolve checked-out commit SHA
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download server artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-artifacts-ubuntu
          path: release-assets

      - name: Extract server
        run: |
          mkdir -p dist/server
          tar xf release-assets/rocketride-server-*-linux-x64.tar.gz -C dist/server
          if [ ! -f dist/server/engine ]; then
            echo "::error::Engine binary not found after extraction"
            ls -la dist/server/
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.engine
          push: true
          platforms: linux/amd64
          # Three mutually exclusive shapes, in priority order:
          #   tag_suffix set   -> <version>-<suffix>   and NO latest
          #   prerelease true  -> <version>-prerelease and no latest
          #   otherwise        -> <version>            and latest
          # The suffix wins over `prerelease` on purpose: a suffixed build is
          # by definition one that must not land on a shared tag, and that
          # intent should not depend on the caller also getting `prerelease`
          # right. `latest` is withheld for the same reason — an experimental
          # branch silently becoming `latest` is the worst outcome available.
          tags: |
            ghcr.io/${{ github.repository_owner }}/rocketride-engine:${{ inputs.server_version }}${{ inputs.tag_suffix != '' && format('-{0}', inputs.tag_suffix) || (inputs.prerelease && '-prerelease' || '') }}
            ${{ (inputs.prerelease == false && inputs.tag_suffix == '') && format('ghcr.io/{0}/rocketride-engine:latest', github.repository_owner) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}

      # The image is built, pushed and signed — but until this step nothing
      # ever STARTED it. Three broken images reached the registry that way:
      # onnxruntime-gpu==1.20.1 unsatisfiable (#1754), the runtime install set,
      # and "No module named 'jwt'" (#1828). Each exited within ~60s of
      # `docker run`, and each was found by someone pulling `latest`.
      #
      # Our own deployments never caught them: the cloud image is assembled
      # differently and its extension happens to supply what the engine forgets
      # to declare. "It works for us" is therefore not evidence about the
      # artefact we publish. This step runs the artefact.
      #
      # Deliberately BEFORE signing — a container that cannot start should not
      # acquire a signature.
      - name: Smoke test — the published image must start
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/rocketride-engine
        run: |
          set -u
          # -i is load-bearing: with no stdin the engine's watcher thread
          # busy-polls /dev/null and pins a core (diagnosed in saas #280).
          docker run -d -i --name rr-smoke -p 5565:5565 "${IMAGE}@${DIGEST}"

          fail() {
            echo "::error::$1"
            echo "----- docker logs -----"
            docker logs rr-smoke 2>&1 | tail -100
            docker inspect rr-smoke --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}'
            exit 1
          }

          # Failure mode one: the process dies. All three known breakages look
          # like this and they show up fast.
          for _ in $(seq 1 36); do
            running=$(docker inspect -f '{{.State.Running}}' rr-smoke 2>/dev/null || echo false)
            if [ "$running" != "true" ]; then
              fail "Container exited before serving — the crash-on-start class."
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:5565/version 2>/dev/null || echo 000)
            if [ "$code" != "000" ]; then
              echo "Engine answered /version with HTTP $code"
              docker rm -f rr-smoke >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 5
          done

          # Alive but never served. Not one of the known three, but a wedged
          # engine reads as healthy to a TCP probe (saas #461), so fail rather
          # than assume it is merely slow.
          fail "Running but never answered /version within 180s."

      # Cosign keyless signing via GitHub OIDC. Signs the image manifest by
      # digest, which covers every tag pointing at it. Verification:
      #   cosign verify ghcr.io/<owner>/rocketride-engine:<tag> \
      #     --certificate-identity-regexp 'https://github\.com/<owner>/rocketride-server/.+' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/rocketride-engine
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
