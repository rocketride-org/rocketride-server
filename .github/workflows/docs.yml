name: Docs

# Build and deploy the co-located documentation site to docs.rocketride.org.
# The site is produced by `builder docs:build` (gather -> index -> compile) and
# emitted to dist/docs.

on:
  push:
    branches: [develop]
    paths:
      - 'packages/docs/**'
      - 'nodes/src/nodes/**/doc.md'
      - 'packages/*/docs/**'
      - 'apps/*/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build docs
        run: node scripts/build.js docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
