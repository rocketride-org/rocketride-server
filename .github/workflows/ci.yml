name: CI
run-name: "Diagnostic PR 3091: isolated Windows SDK at b24e4b82b"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    name: Initialize
    uses: ./.github/workflows/_init.yaml
    with:
      ref: b24e4b82bdd47fe63a7c9ae01bd7ba396e829be9

  windows-sdk:
    name: Isolated Windows SDK
    needs: init
    uses: ./.github/workflows/_build.yaml
    permissions:
      contents: read
      packages: write
    with:
      ref: b24e4b82bdd47fe63a7c9ae01bd7ba396e829be9
      full_version: ${{ needs.init.outputs.full_server_version }}
      build_hash: b24e4b82
      build_stamp: ${{ needs.init.outputs.build_stamp }}
      test: true
      test_targets: client-typescript:test --sequential
      container_test: false
      package: false
    secrets: inherit
