name: Discord Issue Notification

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, assigned, unassigned]

permissions:
  contents: read
  issues: write

concurrency:
  group: discord-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUES_FORUM_WEBHOOK_URL }}
      # Optional: bot token (Manage Threads) to archive closed / unarchive
      # reopened forum threads. Webhooks can't archive; without this secret the
      # embed still reflects state, threads just stay unarchived.
      DISCORD_GITHUB_BOT_TOKEN: ${{ secrets.DISCORD_GITHUB_BOT_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout helper script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/workflows/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build embed, post or patch Discord
        run: |
          # ── Guard: bail if webhook is not configured ─────────────────────
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_ISSUES_FORUM_WEBHOOK_URL secret is not set — skipping"
            exit 0
          fi

          # ── Source the shared discord_curl helper (retry/backoff + status sink) ──
          # shellcheck source=scripts/discord-helper.sh
          source "${GITHUB_WORKSPACE}/.github/workflows/scripts/discord-helper.sh"

          # Back-compat shims: these notifiers source the helper from the default
          # branch (fork-safety), so on the PR that first introduces new helper
          # functions the default-branch helper won't have them yet. Define no-op
          # fallbacks so the workflow degrades gracefully instead of aborting
          # (command not found / exit 127); the real implementations take over
          # automatically once this merges to the default branch.
          command -v discord_applied_tags   >/dev/null 2>&1 || discord_applied_tags()   { printf '[]'; }
          command -v extract_discord_thread >/dev/null 2>&1 || extract_discord_thread() { :; }
          command -v discord_archive_thread >/dev/null 2>&1 || discord_archive_thread() { :; }

          NUMBER="${{ github.event.issue.number }}"

          # ── Fetch current issue state (always fresh, not from stale event payload) ──
          if ! ISSUE=$(gh api "/repos/$REPO/issues/$NUMBER") || [ -z "$ISSUE" ]; then
            echo "Failed to fetch issue #$NUMBER — skipping"
            exit 0
          fi

          TITLE=$(echo    "$ISSUE" | jq -r '.title')
          URL=$(echo      "$ISSUE" | jq -r '.html_url')
          AUTHOR=$(echo   "$ISSUE" | jq -r '.user.login')
          AVATAR=$(echo   "$ISSUE" | jq -r '.user.avatar_url')
          STATE=$(echo    "$ISSUE" | jq -r '.state')
          REASON=$(echo   "$ISSUE" | jq -r '.state_reason // empty')

          LABELS=$(echo    "$ISSUE" | jq -r '[.labels[].name]       | if length==0 then "None"       else join(", ") end')
          ASSIGNEES=$(echo "$ISSUE" | jq -r '[.assignees[].login]   | if length==0 then "Unassigned" else join(", ") end')
          MILESTONE=$(echo "$ISSUE" | jq -r '.milestone.title // "None"')

          # ── Status + color ───────────────────────────────────────────────
          if [ "$STATE" = "open" ]; then
            COLOR=3066993;  STATUS="🟢 Open"
          elif [ "$REASON" = "not_planned" ]; then
            COLOR=9807270;  STATUS="⚫ Closed (not planned)"
          else
            COLOR=15158332; STATUS="🔴 Closed"
          fi

          CREATED=$(echo "$ISSUE" | jq -r '.created_at[0:10]')
          # Clean the issue body for the embed description: drop HTML comments,
          # collapse blank runs, trim, cap under Discord's 4096 embed limit.
          DESC=$(echo "$ISSUE" | jq -r '
            (.body // "")
            | gsub("<!--[\\s\\S]*?-->"; "")
            | gsub("\r"; "")
            | gsub("\n[ \t]*\n[ \t]*\n+"; "\n\n")
            | gsub("^\\s+|\\s+$"; "")
            | if length > 3800 then .[:3800] + " …" else . end')

          # ── Build the detail embed (posted as the 2nd message in the thread) ──
          PAYLOAD=$(jq -n \
            --arg  title     "#$NUMBER $TITLE" \
            --arg  url       "$URL" \
            --arg  author    "$AUTHOR" \
            --arg  avatar    "$AVATAR" \
            --arg  opened    "$AUTHOR opened this issue on $CREATED" \
            --arg  desc      "$DESC" \
            --arg  repo      "$REPO" \
            --arg  status    "$STATUS" \
            --arg  labels    "$LABELS" \
            --arg  assignees "$ASSIGNEES" \
            --arg  milestone "$MILESTONE" \
            --arg  num       "$NUMBER" \
            --argjson color  "$COLOR" \
            '{embeds: [{
              title: $title, url: $url, color: $color,
              author: {name: $opened, url: ("https://github.com/" + $author), icon_url: $avatar},
              description: (if $desc == "" then null else $desc end),
              fields: [
                {name: "Status",    value: $status,    inline: true},
                {name: "Labels",    value: $labels,    inline: true},
                {name: "Assignees", value: $assignees, inline: true},
                {name: "Milestone", value: $milestone, inline: true}
              ],
              footer: {text: ($repo + " · #" + $num)}
            }]}')

          # ── Forum thread name + tags + starter (link) message ────────────
          # The forum post's ROOT message is a plain link (bold headline + URL):
          # Discord unfurls it into the GitHub card, which becomes the forum
          # grid-view image. thread_name (max 100) and applied_tags go on this
          # create POST; the detail embed is posted as a 2nd message afterward.
          THREAD_NAME=$(jq -rn --arg t "#$NUMBER $TITLE" '$t | if length > 100 then .[:100] else . end')
          FORUM_TAGS_CONFIG="${GITHUB_WORKSPACE}/.github/workflows/scripts/discord-forum-tags.json"
          LABELS_JSON=$(echo "$ISSUE" | jq -c '[.labels[].name]')
          APPLIED_TAGS=$(discord_applied_tags "$FORUM_TAGS_CONFIG" issues "$STATE" "$LABELS_JSON")
          STARTER_CONTENT=$(jq -rn --arg t "**#$NUMBER  $TITLE**" --arg u "$URL" '$t + "\n" + $u')
          STARTER_PAYLOAD=$(jq -n --arg c "$STARTER_CONTENT" --arg tn "$THREAD_NAME" --argjson tags "$APPLIED_TAGS" \
            '{content: $c, thread_name: $tn, applied_tags: $tags}')

          # ── Look up stored message ID + forum thread ID ──────────────────
          COMMENTS=$(gh api --paginate "/repos/$REPO/issues/$NUMBER/comments" \
            | jq -s 'add // [] | [.[] | {id: .id, body: .body, author: .user.login}]')

          # First matching marker comment's FULL body. NB: the body is a multi-
          # line <details> block, so this must NOT be piped through `head -1`
          # (that keeps only "<details>" and drops the marker line, so the
          # msg/thread ids never resolve and every event reposts a duplicate).
          MARKER_BODY=$(printf '%s' "$COMMENTS" | \
            jq -r --arg re "$DISCORD_MARKER_PATTERN" 'first(.[] | select(.author == "github-actions[bot]" and (.body | test($re))) | .body) // ""')
          DISCORD_MSG_ID=$(printf '%s' "$MARKER_BODY" | extract_discord_marker)
          DISCORD_THREAD_ID=$(printf '%s' "$MARKER_BODY" | extract_discord_thread)

          # Forum PATCH/DELETE must be scoped to the thread the message lives in.
          THREAD_QS=""
          [ -n "$DISCORD_THREAD_ID" ] && THREAD_QS="?thread_id=$DISCORD_THREAD_ID"

          WEBHOOK_ID=$(echo    "$DISCORD_WEBHOOK_URL" | awk -F'/' '{print $(NF-1)}')
          WEBHOOK_TOKEN=$(echo "$DISCORD_WEBHOOK_URL" | awk -F'/' '{print $NF}')

          # ── Post or patch ────────────────────────────────────────────────
          if [ -n "$DISCORD_MSG_ID" ]; then
            PATCH_BODY=$(discord_curl -X PATCH \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://discord.com/api/webhooks/$WEBHOOK_ID/$WEBHOOK_TOKEN/messages/$DISCORD_MSG_ID$THREAD_QS") || true
            PATCH_STATUS=$(cat "$DISCORD_STATUS_FILE")
            echo "PATCH status: $PATCH_STATUS"

            if [ "$PATCH_STATUS" = "404" ]; then
              STALE_COMMENT_ID=$(echo "$COMMENTS" | \
                jq -r --arg re "$DISCORD_MARKER_PATTERN" '.[] | select(.author == "github-actions[bot]" and (.body | test($re))) | .id' | head -1)
              gh api -X DELETE "/repos/$REPO/issues/comments/$STALE_COMMENT_ID"
              DISCORD_MSG_ID=""
              # Stale thread is gone too — clear it so the archive step targets
              # the recreated thread (NEW_THREAD_ID), not the deleted one.
              DISCORD_THREAD_ID=""
            elif [ "$PATCH_STATUS" != "200" ]; then
              echo "PATCH failed ($PATCH_STATUS): $PATCH_BODY"
              exit 1
            fi
          fi

          if [ -z "$DISCORD_MSG_ID" ]; then
            # 1) Create the forum thread via the starter (link) message.
            #    --no-retry-5xx makes it at-most-once: a retried 5xx/no-response
            #    that actually landed would spawn a duplicate thread. Only 429
            #    (guaranteed rejected) is retried.
            if ! RESPONSE=$(discord_curl --no-retry-5xx -X POST \
              -H "Content-Type: application/json" \
              -d "$STARTER_PAYLOAD" \
              "${DISCORD_WEBHOOK_URL}?wait=true"); then
              echo "::error::Discord starter POST failed (status $(cat "$DISCORD_STATUS_FILE")) after retries"
              exit 1
            fi
            # For a forum create, channel_id is the new thread's id (== starter msg id).
            NEW_THREAD_ID=$(echo "$RESPONSE" | jq -r '.channel_id // empty')
            NEW_THREAD_QS=""
            [ -n "$NEW_THREAD_ID" ] && NEW_THREAD_QS="?thread_id=$NEW_THREAD_ID"

            # 2) Post the detail embed as the 2nd message in the thread. If it
            #    fails, delete the just-created thread so the next event retries
            #    cleanly instead of leaving a link-only post behind.
            if ! DETAIL=$(discord_curl --no-retry-5xx -X POST -H "Content-Type: application/json" -d "$PAYLOAD" \
              "https://discord.com/api/webhooks/$WEBHOOK_ID/$WEBHOOK_TOKEN?wait=true&thread_id=$NEW_THREAD_ID"); then
              discord_curl -X DELETE "https://discord.com/api/webhooks/$WEBHOOK_ID/$WEBHOOK_TOKEN/messages/$NEW_THREAD_ID$NEW_THREAD_QS" > /dev/null || true
              echo "::error::Discord detail embed POST failed (status $(cat "$DISCORD_STATUS_FILE"))"
              exit 1
            fi
            NEW_MSG_ID=$(echo "$DETAIL" | jq -r '.id')

            # ── Race guard: re-check for a comment created by a concurrent run ──
            EXISTING=$(gh api --paginate "/repos/$REPO/issues/$NUMBER/comments" 2>/dev/null \
              | jq -sc --arg re "$DISCORD_MARKER_PATTERN" 'add // [] | [.[] | select(.user.login == "github-actions[bot]" and (.body | test($re)))] | first // empty')

            if [ -n "$EXISTING" ]; then
              # Another run won — delete our whole duplicate thread (deleting the
              # root/starter message removes it), then patch the winner's embed.
              discord_curl -X DELETE "https://discord.com/api/webhooks/$WEBHOOK_ID/$WEBHOOK_TOKEN/messages/$NEW_THREAD_ID$NEW_THREAD_QS" > /dev/null || true
              DISCORD_MSG_ID=$(echo "$EXISTING" | jq -r '.body' | extract_discord_marker)
              WINNER_THREAD_ID=$(echo "$EXISTING" | jq -r '.body' | extract_discord_thread)
              WINNER_QS=""
              [ -n "$WINNER_THREAD_ID" ] && WINNER_QS="?thread_id=$WINNER_THREAD_ID"
              discord_curl -X PATCH -H "Content-Type: application/json" -d "$PAYLOAD" \
                "https://discord.com/api/webhooks/$WEBHOOK_ID/$WEBHOOK_TOKEN/messages/$DISCORD_MSG_ID$WINNER_QS" > /dev/null || true
            else
              DISCORD_MSG_ID="$NEW_MSG_ID"
              COMMENT_BODY=$(render_discord_marker "$DISCORD_MSG_ID" "$NEW_THREAD_ID")
              gh api "/repos/$REPO/issues/$NUMBER/comments" \
                -X POST \
                -f body="$COMMENT_BODY"
            fi
          fi

          # ── Mirror closed/open state onto the forum thread (archive) ─────
          # No-op unless DISCORD_GITHUB_BOT_TOKEN is set. Prefer the stored thread id,
          # then the race winner's, then a freshly created one.
          FINAL_THREAD_ID="${DISCORD_THREAD_ID:-}"
          [ -z "$FINAL_THREAD_ID" ] && FINAL_THREAD_ID="${WINNER_THREAD_ID:-}"
          [ -z "$FINAL_THREAD_ID" ] && FINAL_THREAD_ID="${NEW_THREAD_ID:-}"
          if [ "$STATE" = "open" ]; then
            discord_archive_thread "$FINAL_THREAD_ID" false
          else
            discord_archive_thread "$FINAL_THREAD_ID" true
          fi
