# Composite action that installs cosign and downloads the pinned mcp-publisher
# release into the working directory (./mcp-publisher), after verifying its
# Sigstore bundle. Shared by publish-mcp-registry.yml and
# validate-mcp-server-json.yml so both use the same verified binary.
name: Setup mcp-publisher
description: >-
  Install cosign, then download and verify a pinned mcp-publisher release
  (modelcontextprotocol/registry). The binary is left at ./mcp-publisher.

inputs:
  version:
    description: mcp-publisher release tag to install.
    required: false
    default: v1.8.1

runs:
  using: 'composite'
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Download and verify mcp-publisher
      shell: bash
      env:
        MCP_PUBLISHER_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
        archive="mcp-publisher_${os}_${arch}.tar.gz"
        base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

        curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
        curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
        cosign verify-blob \
          --bundle "$archive.sigstore.json" \
          --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "$archive"
        tar xzf "$archive" mcp-publisher
        rm -f "$archive" "$archive.sigstore.json"
