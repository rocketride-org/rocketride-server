[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketride"
version = "1.4.0"
description = "RocketRide Pipeline Python Client SDK"
readme = "README.md"
authors = [
    {name = "RocketRide, Inc.", email = "dev@rocketride.ai"}
]
maintainers = [
    {name = "RocketRide, Inc.", email = "dev@rocketride.ai"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = [
    "rocketride",
    "pipeline",
    "dap", 
    "debug-adapter-protocol",
    "data-processing",
    "client-sdk",
    "async",
    "websocket",
]
dependencies = [
    "websockets>=11.0.0",
    "aiofiles>=23.0.0",
    "pydantic>=2.0.0",
    "pathspec>=0.12.0",
    "typing_extensions>=4.0.0",
]
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
# 'rocketride[otel]' is pulled into both test-facing extras on purpose:
# tests/test_otel_mapper.py and tests/test_otel_setup.py import opentelemetry
# unconditionally, so an environment that can run the suite must carry it.
# (CI installs neither extra — it runs pytest on the engine interpreter, which
# gets these from tests/requirements.txt via the client-python:setup-test-deps
# build step.)
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.8.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "rocketride[otel]",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "python-dotenv>=1.0.0",
    "rocketride[otel]",
    # The cmark-gfm oracle for the pipediff Markdown-escaping tests: it wraps
    # the same renderer GitHub uses for comments. CI does not install this
    # extra — it runs pytest through the bundled engine — so it gets the same
    # wheel from tests/requirements.txt via the client-python:setup-test-deps
    # step, and the cross-check runs there rather than skipping. The escaping
    # rules are also asserted without it (see tests/test_pipediff_reporters.py)
    # for an interpreter that has neither.
    "cmarkgfm>=2024.1.14",
]

otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    # otelbridge/setup.py subclasses requests.Session, and the OTLP/HTTP
    # exporter does not bring requests along from 1.45 on. 2.32.4 fixes
    # CVE-2024-47081 (.netrc credentials sent to a crafted URL).
    "requests>=2.32.4",
]

[project.urls]
Homepage = "https://github.com/rocketride-ai/rocketride-server"
Documentation = "https://github.com/rocketride-ai/rocketride-server#readme"
Repository = "https://github.com/rocketride-ai/rocketride-server.git"
"Bug Reports" = "https://github.com/rocketride-ai/rocketride-server/issues"

[project.scripts]
rocketride = "rocketride.cli.main:main"

# `rocketride_common` is a source library shared with the TypeScript client, not
# a separate distribution: `rocketride.cli.main` imports it at module scope (via
# `cli/utils/env.py`), so the CLI cannot start without it. The builder stages it
# into `src/` before building the released wheel, but the checked-out source tree
# is the one layout where the two packages sit apart — which is exactly the
# layout `pip install ./packages/client-python` (and the pipe-diff action's
# `install-from`) builds from. Listing the sibling source root here makes both
# find the shared package; the entry is simply skipped when the directory is
# absent, so the builder's staged layout is unaffected and the released
# wheel/sdist still carry `rocketride_common` from `src/` exactly as before.
[tool.setuptools.packages.find]
where = ["src", "../client-common/python/src"]
include = ["rocketride*"]

[tool.setuptools.package-data]
rocketride = ["py.typed"]
